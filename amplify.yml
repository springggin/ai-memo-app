version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify SSR 런타임은 콘솔 환경 변수를 직접 읽지 못하므로 빌드 시 .env.production 에 기록한다
        - env | grep -e '^NEXT_PUBLIC_' -e '^ANTHROPIC_API_KEY=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
